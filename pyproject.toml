[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classificacao-feijao"
version = "0.1.0"
description = "Experimento reproduzivel de classificacao de doencas em folhas de feijao"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "keras>=3.12.0",
  "numpy>=2.2.0",
  "opencv-python-headless>=4.12.0.88",
  "scikit-learn>=1.7.0",
  "scipy>=1.16.0",
  "tensorflow>=2.20.0",
  "tensorflow-datasets>=4.9.0",
]

[project.scripts]
experimento-feijao = "experimento_feijao.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.4.0",
  "ruff>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/experimento_feijao"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
