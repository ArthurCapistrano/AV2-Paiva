[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classificacao-feijao"
version = "0.1.0"
description = "Experimento reproduzivel de classificacao de doencas em folhas de feijao"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "keras>=3.12.0",
  "numpy>=2.2.0",
  "opencv-python-headless>=4.12.0.88",
  "importlib-resources>=6.5.0",
  "scikit-learn>=1.7.0",
  "scipy>=1.16.0",
  "tensorflow[and-cuda]>=2.20.0",
]

[project.scripts]
experimento-feijao = "experimento_feijao.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/experimento_feijao"]
